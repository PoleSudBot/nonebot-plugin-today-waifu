{% set columns = columns | default(4) %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #fdfafb;
      color: #332d30;
      position: relative;
      overflow-x: hidden;
      min-height: 100vh;
    }
    body::before, body::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      z-index: -1;
      filter: blur(90px);
    }
    body::before {
      width: 60vw;
      height: 60vw;
      background: rgba(255, 102, 153, 0.12);
      top: -10vw;
      left: -5vw;
    }
    body::after {
      width: 50vw;
      height: 50vw;
      background: rgba(142, 185, 237, 0.12);
      bottom: -10vw;
      right: -5vw;
    }
    .glass-panel {
      width: 920px;
      margin: 40px auto;
      padding: 40px 48px;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 36px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.04), inset 0 1px 0 rgba(255,255,255,0.9);
    }
    header {
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255, 102, 153, 0.15);
      text-align: center;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 38px;
      font-weight: 800;
      color: #2c282a;
      letter-spacing: -0.5px;
    }
    .sub {
      font-size: 16px;
      color: #8c8387;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat({{ columns }}, minmax(0, 1fr));
      gap: 16px;
    }
    .pair {
      min-width: 0;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 8px 24px rgba(255, 102, 153, 0.03);
      transition: transform 0.2s;
    }
    .avatars {
      display: flex;
      justify-content: center;
      margin-bottom: 14px;
    }
    .avatar {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 3px solid #fff;
      object-fit: cover;
      background: #fdf5f7;
      box-shadow: 0 4px 12px rgba(255, 102, 153, 0.1);
      z-index: 1;
    }
    .avatars img:first-child {
      margin-right: -20px;
      z-index: 2;
    }
    .names {
      text-align: center;
      min-width: 0;
      width: 100%;
      font-size: 15px;
      font-weight: 600;
      color: #4a4245;
      line-height: 1.3;
    }
    .name-truncate {
      display: block;
      min-width: 0;
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      padding: 0 4px;
    }
    .heart-icon {
      display: block;
      color: #ff6699;
      font-size: 13px;
      margin: 3px 0;
      opacity: 0.8;
      font-family: serif;
    }
  </style>
</head>
<body>
<main class="glass-panel">
  <header>
    <h1>{{ title }}</h1>
    <div class="sub">Scene ID: {{ scene_id }}</div>
  </header>
  <section class="grid">
    {% for pair in pairs %}
    <article class="pair">
      <div class="avatars">
        <img class="avatar" src="{{ pair.left_avatar or '' }}" />
        <img class="avatar" src="{{ pair.right_avatar or '' }}" />
      </div>
      <div class="names">
        <span class="name-truncate">{{ pair.left_name }}</span>
        <span class="heart-icon">♥</span>
        <span class="name-truncate">{{ pair.right_name }}</span>
      </div>
    </article>
    {% endfor %}
  </section>
</main>
</body>
</html>
